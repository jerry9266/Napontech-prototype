<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Project | NaponTech</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-blue: #2563EB; --brand-blue-hover: #1D4ED8; --accent-yellow: #FFB800;
            --black: #0A0A0A; --dark: #111111; --white: #FFFFFF; --off-white: #F3F3F0;
            --text-dark: #111827; --text-gray: #4B5563; --text-light: #9CA3AF;
            --border: #E5E7EB; --border-dark: #222222; --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html { width: 100%; }
        body { background-color: var(--off-white); color: var(--text-gray); line-height: 1.6; overflow-x: clip; width: 100%; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        
        h1, h2, h3, h4 { color: var(--text-dark); line-height: 1.3; font-family: 'Montserrat', sans-serif; }
        p { margin-bottom: 15px; }

        /* Minimal Navigation Header */
        nav {
            display: flex; justify-content: flex-start; align-items: center;
            padding: 12px 5%; background: linear-gradient(135deg, var(--black) 70%, #4a3800 90%, var(--accent-yellow) 120%);
            border-bottom: 2px solid var(--accent-yellow); box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: sticky; top: 0; z-index: 1000; height: 70px; width: 100%;
        }

        .nav-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { color: var(--white); font-size: 1.3rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; }
        .back-btn:hover { color: var(--accent-yellow); background: rgba(255, 255, 255, 0.1); transform: translateX(-3px); }
        .header-title { color: var(--white); font-size: 1.25rem; font-weight: 700; white-space: nowrap; font-family: 'Montserrat', sans-serif; }

        /* Scroll Animations */
        .reveal-up { opacity: 0; transform: translateY(40px); transition: all 0.7s ease-out; }
        .reveal-scale { opacity: 0; transform: scale(0.92); transition: all 0.7s ease-out; }
        .reveal-active { opacity: 1 !important; transform: translate(0) !important; }
        .delay-1 { transition-delay: 0.1s; }

        /* Page Hero */
        .page-hero {
            background: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.9)), url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=1600&h=500&fit=crop') center/cover no-repeat;
            color: var(--white); padding: 100px 5%; text-align: center;
        }
        .page-hero h1 { color: var(--white); font-size: clamp(2.2rem, 5vw, 3.5rem); margin-bottom: 15px; text-shadow: 0 4px 12px rgba(0,0,0,0.7); }
        .page-hero p { font-size: 1.1rem; max-width: 650px; margin: 0 auto; color: var(--text-light); text-shadow: 0 2px 6px rgba(0,0,0,0.8); }

        /* Tracker Section */
        .tracker-section { padding: 80px 5%; max-width: 800px; margin: 0 auto; }
        .tracker-card { background: var(--white); padding: 50px 40px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .tracker-icon { font-size: 3rem; color: var(--brand-blue); margin-bottom: 20px; }
        .tracker-card h2 { margin-bottom: 10px; }
        .tracker-card p { color: var(--text-gray); margin-bottom: 30px; font-size: 0.95rem; }

        .track-form { display: flex; flex-direction: column; gap: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { text-align: left; }
        .form-label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-dark); font-size: 0.9rem; }
        .form-control { width: 100%; padding: 14px 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1.05rem; background-color: var(--off-white); transition: var(--transition); outline: none; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .form-control:focus { border-color: var(--brand-blue); background-color: var(--white); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn-track { background: var(--brand-blue); color: var(--white); border: none; padding: 15px; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-track:hover { background: var(--brand-blue-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-track:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

        .error-box { display: none; margin-top: 15px; padding: 12px; border-radius: 8px; background: #FEF2F2; color: #DC2626; border: 1px solid #F87171; font-size: 0.9rem; font-weight: 500; }

        @media (max-width: 768px) {
            .tracker-card { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <!-- Minimal Header -->
    <nav>
        <div class="nav-left">
            <div class="back-btn" onclick="history.back()" title="Go Back">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <span class="header-title">Track Your Project</span>
        </div>
    </nav>

    <!-- Page Hero -->
    <header class="page-hero reveal-up">
        <h1>Track Your Project</h1>
        <p>Monitor your project's development progress, status, and milestone updates in real time.</p>
    </header>

    <!-- Tracker Section -->
    <section class="tracker-section">
        <div class="tracker-card reveal-scale delay-1">
            <i class="fa-solid fa-map-location-dot tracker-icon"></i>
            <h2>Enter Project Tracking ID</h2>
            <p>Enter the unique project code provided by your project manager to view status.</p>
            
            <form class="track-form" id="trackingForm">
                <div class="form-group">
                    <label class="form-label">Tracking ID</label>
                    <input type="text" id="trackInput" class="form-control" placeholder="e.g. NAP-8K4P92X7" required maxlength="50" autocomplete="off">
                    <div class="error-box" id="errorMsg"></div>
                </div>
                <button type="submit" class="btn-track" id="trackBtn">
                    <span>Track Project</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </section>

    <!-- Centralized Footer Container -->
    <div id="footer-container"></div>

    <script>
        const BACKEND_URL = "https://one11111111111111.onrender.com";

        document.addEventListener("DOMContentLoaded", () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-active');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal-up, .reveal-scale').forEach(el => observer.observe(el));

            // Footer Fetch
            fetch('footer.html')
                .then(response => response.text())
                .then(html => {
                    const container = document.getElementById('footer-container');
                    container.innerHTML = html;
                    const yearEl = container.querySelector('#copyright-year');
                    if (yearEl) yearEl.textContent = new Date().getFullYear();
                    container.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
                })
                .catch(() => {});

            const form = document.getElementById('trackingForm');
            const btn = document.getElementById('trackBtn');
            const input = document.getElementById('trackInput');
            const errorMsg = document.getElementById('errorMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMsg.style.display = 'none';

                const enteredId = input.value.trim().toUpperCase();
                if (!enteredId) return;

                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Locating Project...`;

                try {
                    const res = await fetch(`${BACKEND_URL}/api/project/get`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ trackingId: enteredId })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        window.location.href = `Project_Track_Details.html?id=${encodeURIComponent(enteredId)}`;
                    } else {
                        errorMsg.textContent = data.error || 'Project not found. Please check your Tracking ID and try again.';
                        errorMsg.style.display = 'block';
                        input.style.borderColor = '#dc2626';
                    }
                } catch (err) {
                    errorMsg.textContent = 'Could not reach server. Please check your network connection.';
                    errorMsg.style.display = 'block';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<span>Track Project</span> <i class="fa-solid fa-arrow-right"></i>`;
                }
            });

            input.addEventListener('input', () => {
                errorMsg.style.display = 'none';
                input.style.borderColor = '#d1d5db';
            });
        });
    </script>
</body>
</html>
